<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TDAHNav</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- Cabeçalho / Navbar -->
  <header class="navbar">
    <div class="logo">
      <span class="logo-icon">🧭</span>
      <span class="logo-text">TDAHNav</span>
    </div>
    <nav class="nav-links">
      <a href="#" class="nav-btn">Ferramentas</a>
      <a href="#" class="nav-btn nav-btn-outline">Emergência</a>
    </nav>
  </header>

  <!-- Conteúdo Principal -->
  <main class="container">
    <span class="subtitle">FERRAMENTAS INTERATIVAS</span>
    <h1 class="main-title">Escolha o que você precisa agora</h1>

    <!-- Seleção de Abas/Ferramentas -->
    <div class="tabs-container">
      <button class="tab-card active">
        <span class="tab-icon">🔍</span>
        <span class="tab-label">Simplificador</span>
      </button>

      <button class="tab-card">
        <span class="tab-icon">📁</span>
        <span class="tab-label">Decompositor de Tarefas</span>
      </button>

      <button class="tab-card">
        <span class="tab-icon">🤖</span>
        <span class="tab-label">Prompts Prontos para IA</span>
      </button>
    </div>

    <!-- Área da Ferramenta Ativa -->
    <section class="tool-content">
      <div class="tool-header">
        <h2><span class="tool-icon">🔍</span> Simplificador</h2>
        <p>Cole qualquer texto confuso — receba uma lista clara</p>
      </div>

      <div class="input-group">
        <textarea placeholder="Cole aqui qualquer texto confuso: instruções, formulário, e-mail complicado, FAQ obscuro..."></textarea>
      </div>

      <button class="action-btn">+ Simplificar agora</button>
    </section>
  </main>

</body>
</html>
